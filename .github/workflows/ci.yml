name: Integração contínua

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, testes e imagem Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Instalar dependências dos testes de navegador
        run: npm ci

      - name: Validar cenários automáticos do Swagger
        run: npm run test:unit

      - name: Instalar Chromium para testes de navegador
        run: npx playwright install --with-deps chromium

      - name: Executar build e todos os testes Java
        run: ./mvnw -B -ntp verify

      - name: Validar configuração do ambiente
        run: |
          sh scripts/setup-local.sh
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet

      - name: Construir imagem de execução
        run: docker build --tag product-activation-platform:local .

      - name: Executar cenários HTTP automatizados
        run: |
          docker compose up -d --no-build --wait
          npm run test:e2e
          docker compose --profile test run --rm --no-deps newman

      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose down

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-de-testes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/swagger-e2e/
          if-no-files-found: ignore
          retention-days: 7
