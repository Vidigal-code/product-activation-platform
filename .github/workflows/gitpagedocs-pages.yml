name: Publicar documentação

on:
  push:
    branches: [main]
    paths:
      - 'gitpagedocs/**'
      - '.github/workflows/gitpagedocs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir documentação estática
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      GITHUB_ACTIONS: 'true'
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITPAGEDOCS_REPOSITORY_SEARCH: 'false'
      GITPAGEDOCS_PATH: docs
    steps:
      - name: Obter documentação
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Obter runtime fixado do GitPageDocs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vidigal-code/git-page-docs
          ref: ce8a0b01156f9b558f504a673281a21494d14b69 # v0.0.17
          path: .gitpagedocs-runtime
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: .gitpagedocs-runtime/pnpm-lock.yaml

      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Preparar conteúdo do projeto
        run: |
          rm -rf .gitpagedocs-runtime/gitpagedocs
          cp -R gitpagedocs .gitpagedocs-runtime/gitpagedocs
          cp gitpagedocs/icon.svg .gitpagedocs-runtime/frontend/public/icon.svg

      - name: Instalar dependências do runtime
        working-directory: .gitpagedocs-runtime
        run: pnpm install --frozen-lockfile

      - name: Compilar o site
        working-directory: .gitpagedocs-runtime
        run: pnpm exec next build frontend

      - name: Preparar endereço público
        run: |
          mkdir -p .pages/docs
          cp -R .gitpagedocs-runtime/frontend/out/_next .pages/docs/
          cp .gitpagedocs-runtime/frontend/out/{index.html,index.txt,404.html,icon.svg} .pages/docs/
          touch .pages/.nojekyll
          printf '%s' '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./docs/"><title>Product Activation Platform</title><a href="./docs/">Documentação</a></html>' > .pages/index.html

      - name: Publicar artefato
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/
    steps:
      - name: Disponibilizar documentação
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
