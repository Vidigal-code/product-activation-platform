services:
  app:
    environment:
      OTLP_TRACING_ENABLED: "true"
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLE_PROBABILITY: "1.0"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
